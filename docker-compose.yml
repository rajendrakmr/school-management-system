services:
  mysql:
    container_name: mysql
    image: mysql:latest
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: TEST@1998 
      MYSQL_DATABASE: school_erp_db 
    volumes:
      - mysql-data:/var/lib/mysql 
    networks:
      - school-erp
    healthcheck:
      test: ["CMD","mysqladmin", "ping","-h","localhost"]
      interval: 10s 
      timeout: 5s 
      retries: 3 
      start_period: 30s
  backend: 
    container_name: backendjs 
    build:
      context: ./backend 
    environment:
        NODE_ENV: production
        PORT: 5000
        DB_HOST: mysql
        DB_USER: root
        DB_PASSWORD: TEST@1998  
        DB_NAME: school_erp_db
    networks:
      - school-erp 
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 5000:5000
  frontend:
    container_name: reactjs
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy 
    ports:
      - 80:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/apps"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - school-erp
volumes:
  mysql-data:
networks:
  school-erp: