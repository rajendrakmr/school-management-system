services:
    mysql:    
        container_name: mysql
        image: mysql:latest 
        ports:
            - 3306:3306 
        environment:
            MYSQL_DATABASE: school_erp_db
            MYSQL_ROOT_PASSWORD: root 
        volumes:
            - mysql-data:/var/lib/mysql 
        networks:
            - erp-school
        healthcheck:
            test: ["CMD","mysqladmin","ping","-h","localhost"]
            interval: 10s 
            timeout: 5s
            retries: 3
            start_period: 30s
    backend:
        container_name: nodejs
        build:
            context: ./fronted
        environment:
            NODE_ENV: production
            PORT: 5000
            DB_HOST: mysql
            DB_USER: root
            DB_PASSWORD: root  
            DB_NAME: school_erp_db
        ports:
          - 5000:5000
        networks:
            - erp-school 
        depends_on:
            mysql:
                condition: service_healthy 
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s 
    fronted:
        container_name: reactjs 
        build:
            context: ./fronted
        ports:
            - 80:80
        networks:
            - erp-school 
        depends_on:
            backend:
                condition: service_healthy 
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:80/apps"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        volumes:
            - ./fronted/nginx.conf:/etc/nginx/conf.d/default.conf
volumes:
    mysql-data:
networks:
    erp-school:

    


