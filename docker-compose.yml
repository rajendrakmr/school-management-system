version: '3.8'

services:
  mysql:    
    container_name: mysql
    image: mysql:latest 
    ports:
      - 3306:3306 
    environment:
      MYSQL_DATABASE: school_erp1_db
      MYSQL_ROOT_PASSWORD: root 
    volumes:
      - mysql-data:/var/lib/mysql 
    networks:
      - erp-school
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s 
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    container_name: nodejs
    build:
      context: ./backend   # point to backend folder
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root  
      DB_NAME: school_erp1_db
    ports:
      - 5000:5000
    networks:
      - erp-school 
    depends_on:
      mysql:
        condition: service_healthy 
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s 

  frontend:
    container_name: reactjs 
    build:
      context: ./frontend   # React app folder
    ports:
      - 80:80
    networks:
      - erp-school 
    depends_on:
      backend:
        condition: service_healthy 
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:

networks:
  erp-school:
    driver: bridge
